<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARS - Rescue Dashboard</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/api.js?v=4"></script>
  <script src="../assets/js/app-state.js"></script>
  <script src="../assets/js/map-manager.js"></script>
  <script src="../assets/js/rescuer-dashboard.js"></script>
</head>
<body>
  <div class="dashboard-layout">
    <div id="dashboard-error" role="alert" style="display: none; padding: 8px 20px; background: var(--panel-navy); border-bottom: 1px solid var(--siren-red); color: var(--text-primary);"></div>

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button id="mobile-sidebar-toggle" class="sidebar-mobile-toggle" aria-label="Toggle Navigation Sidebar">
          ☰
        </button>
        <img src="../assets/logo.png" alt="ARS Logo" class="brand-logo-small">
        <div class="app-title-group">
          <span class="app-title">ARS - Rescue Dashboard</span>
          <div class="live-indicator">
            <span class="live-dot"></span>
            <span id="active-sos-count">0 Active</span>
          </div>
        </div>
      </div>

      <div class="top-bar-right">
        <!-- Notifications Bell -->
        <button id="notif-bell-btn" class="notif-bell-btn" aria-label="Notifications Center">
          🔔
          <span id="notif-unread-count" class="notif-badge" style="display: none;">0</span>
        </button>

        <!-- Notifications Dropdown Popover -->
        <div id="notif-dropdown" class="notif-dropdown">
          <div class="notif-header">
            <span>Rescue Dispatch Alerts</span>
            <button onclick="window.ARS_State.markAllNotificationsRead()" style="font-size: 0.78rem; color: var(--siren-red); font-weight: 600;">Mark all read</button>
          </div>
          <div id="notif-list" class="notif-list">
            <!-- Notifications injected via JS -->
          </div>
        </div>

        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle Dark Light Theme">
          ☀️
        </button>

        <!-- Sign Out Button -->
        <button id="signout-btn" class="btn-outline-squircle">
          Sign Out
        </button>
      </div>
    </header>

    <!-- Main Workspace Body -->
    <div class="dashboard-body">
      <!-- Left Command Navy Sidebar with Thin Red Active Line -->
      <aside class="sidebar">
        <div class="sidebar-item active" data-tab="dashboard">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10.5 12 3l9 7.5M5 9v11h14V9M9 20v-6h6v6"/></svg>
          <span>Dashboard</span>
        </div>
        <div class="sidebar-item" data-tab="active_sos">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>Active SOS</span>
        </div>
        <div class="sidebar-item" data-tab="accepted_cases">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>Accepted Cases</span>
        </div>
        <div class="sidebar-item" data-tab="history">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>Rescue History</span>
        </div>
        <div class="sidebar-item" data-tab="profile">
          <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span>My Profile</span>
        </div>

        <div style="margin-top: auto; padding: 12px 8px;">
          <a href="../trigger-sos/index.html" target="_blank" class="btn-secondary" style="width: 100%; font-size: 0.8rem; text-align: center;">
            🧪 Test SOS Simulator
          </a>
        </div>
      </aside>

      <!-- Dashboard Split Content -->
      <main class="dashboard-content">
        <!-- Left Panel: SOS Cards List -->
        <section class="left-panel">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <h2 id="tab-title" class="font-heading" style="font-size: 1.25rem;">Active Emergency SOS Requests</h2>
            <button id="simulate-sos-btn" class="btn-primary" style="padding: 8px 16px; font-size: 0.82rem;">
              + Simulate New SOS
            </button>
          </div>

          <!-- SOS Cards Injected via JS -->
          <div id="sos-cards-container" style="display: flex; flex-direction: column; gap: 16px;"></div>
        </section>

        <!-- Right Panel: Google Map Canvas -->
        <section class="right-panel">
          <!-- Floating Map Legend Chip -->
          <div class="map-legend-chip">
            <div class="legend-item">
              <span class="legend-color-dot legend-high"></span>
              <span>High</span>
            </div>
            <div class="legend-item">
              <span class="legend-color-dot legend-medium"></span>
              <span>Medium</span>
            </div>
            <div class="legend-item">
              <span class="legend-color-dot legend-low"></span>
              <span>Low</span>
            </div>
          </div>

          <!-- Map Container -->
          <div id="map-canvas"></div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
